version: '3.9'

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-slateedge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-locally}
      POSTGRES_DB: ${POSTGRES_DB:-slateedge}
    ports:
      - '5432:5432'
    volumes:
      - slateedge_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-slateedge}']
      interval: 5s
      timeout: 5s
      retries: 10

  optimizer:
    build:
      context: ./optimizer-service
    restart: unless-stopped
    ports:
      - '8000:8000'
    healthcheck:
      test: ['CMD', 'python', '-c', "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 10

  web:
    build:
      context: ./web
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://slateedge:change-me-locally@db:5432/slateedge?schema=public}
      AUTH_SECRET: ${AUTH_SECRET:-replace-this-with-a-long-random-string}
      OPTIMIZER_SERVICE_URL: http://optimizer:8000
      NODE_ENV: production
    ports:
      - '3000:3000'
    depends_on:
      db:
        condition: service_healthy
      optimizer:
        condition: service_healthy
    command: sh -c "npx prisma migrate deploy && npm run start"

volumes:
  slateedge_pgdata:
